<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#00677d" />
    <title>POLARIS</title>
    <style>
      :root {
        --surface: #f8f9ff;
        --card: #ffffff;
        --ink: #0b1c30;
        --muted: #3d494d;
        --primary: #00677d;
        --line: #d3e4fe;
        --error: #ba1a1a;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--surface);
        color: var(--ink);
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
      }
      main { width: 100%; max-width: 380px; text-align: center; }
      img { width: 88px; height: 88px; }
      h1 { font-size: 26px; letter-spacing: 0.12em; margin: 12px 0 2px; }
      .tag { color: var(--muted); font-size: 14px; margin: 0 0 28px; }
      .status { min-height: 48px; color: var(--muted); font-size: 14px; }
      .status.error { color: var(--error); }
      .spinner {
        width: 22px; height: 22px; margin: 0 auto 8px;
        border: 3px solid var(--line); border-top-color: var(--primary); border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      form { display: none; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
      form.open { display: block; }
      label { font-size: 13px; font-weight: 600; color: var(--muted); }
      input {
        width: 100%; margin: 6px 0 12px; padding: 12px; font-size: 16px;
        border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink);
      }
      button { width: 100%; padding: 12px; font-size: 16px; font-weight: 600; border-radius: 10px; border: 0; cursor: pointer; }
      .primary { background: var(--primary); color: #fff; }
      .ghost { background: transparent; color: var(--primary); margin-top: 8px; }
      .hint { font-size: 12px; color: var(--muted); margin: 10px 0 0; }
    </style>
  </head>
  <body>
    <main>
      <img src="polaris-emblem.svg" alt="" />
      <h1>POLARIS</h1>
      <p class="tag">Indian Polar Science Knowledge Platform</p>

      <div id="status" class="status"></div>

      <form id="form">
        <label for="url">POLARIS server address</label>
        <input id="url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="http://192.168.1.10:3000" required />
        <button class="primary" type="submit">Connect</button>
        <p class="hint">Use the address shown when POLARIS starts on your PC (phone and PC on the same Wi-Fi), or your hosted address such as https://polaris.onrender.com.</p>
      </form>
      <button id="change" class="ghost" type="button">Change server</button>
    </main>

    <script src="config.js"></script>
    <script>
      const KEY = 'polaris-server';
      const $ = (id) => document.getElementById(id);
      const params = new URLSearchParams(location.search);

      function saved() {
        try { return localStorage.getItem(KEY); } catch { return null; }
      }
      function save(url) {
        try { localStorage.setItem(KEY, url); } catch { /* storage unavailable */ }
      }
      function normalise(raw) {
        let u = raw.trim().replace(/\/+$/, '');
        if (!/^https?:\/\//i.test(u)) u = 'http://' + u;
        return u;
      }
      function setStatus(html, isError) {
        $('status').innerHTML = html;
        $('status').className = 'status' + (isError ? ' error' : '');
      }
      function showForm(url) {
        $('url').value = url || '';
        $('form').classList.add('open');
        $('change').style.display = 'none';
      }

      let cancelled = false;
      async function connect(url) {
        cancelled = false;
        $('form').classList.remove('open');
        $('change').style.display = '';
        setStatus('<div class="spinner"></div>Connecting to ' + url.replace(/</g, '&lt;'));
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 8000);
        try {
          await fetch(url + '/api/health', { mode: 'no-cors', cache: 'no-store', signal: ctrl.signal });
          if (cancelled) return;
          save(url);
          location.replace(url + '/');
        } catch {
          if (cancelled) return;
          setStatus("Can't reach " + url.replace(/</g, '&lt;') + '. Check that POLARIS is running and the phone is on the same network.', true);
          showForm(url);
        } finally {
          clearTimeout(timer);
        }
      }

      $('change').addEventListener('click', () => {
        cancelled = true;
        setStatus('');
        showForm(saved() || window.POLARIS_DEFAULT_SERVER);
      });
      $('form').addEventListener('submit', (e) => {
        e.preventDefault();
        connect(normalise($('url').value));
      });

      const start = saved() || window.POLARIS_DEFAULT_SERVER;
      if (params.has('error')) {
        setStatus('The server stopped responding. Reconnect or enter a different address.', true);
        showForm(start);
      } else if (start) {
        connect(start);
      } else {
        showForm('');
      }
    </script>
  </body>
</html>
