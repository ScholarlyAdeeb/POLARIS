<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HIMAKSHA - Indian Polar Science Knowledge Platform</title>
    <meta name="description" content="SIH 2026 prototype built for NCPOR (MoES): expedition reports, datasets, publications, photographs, videos and institutional activities, mapped, linked and turned into reviewed outreach content." />
    <meta property="og:title" content="HIMAKSHA - Indian Polar Science Knowledge Platform" />
    <meta property="og:description" content="SIH 2026 prototype built for NCPOR (MoES): expedition reports, datasets, publications, photographs, videos and institutional activities, mapped, linked and turned into reviewed outreach content." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    
    <link rel="icon" type="image/svg+xml" href="/polaris-emblem.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#00677d" />

    <!-- Boot splash: plain HTML/CSS so it paints before any JavaScript loads. Shown once per tab session. -->
    <script>
      try { if (sessionStorage.getItem('polaris-booted')) document.documentElement.classList.add('boot-skip'); } catch (e) {}
    </script>
    <style>
      html.boot-skip #boot { display: none; }
      #boot {
        position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center; overflow: hidden;
        color: #fff; font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif; cursor: pointer;
        background: radial-gradient(120% 90% at 50% 115%, #1b3a7a 0%, #0b132b 55%, #050b1c 100%);
        transition: opacity .7s ease, transform .7s ease, visibility .7s;
      }
      #boot.done { opacity: 0; transform: scale(1.05); visibility: hidden; pointer-events: none; }
      /* stars */
      #boot::before {
        content: ''; position: absolute; inset: 0; opacity: .8; animation: bootTwinkle 3.2s ease-in-out infinite alternate;
        background-image:
          radial-gradient(1.2px 1.2px at 12% 18%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 28% 72%, #fff 50%, transparent 51%),
          radial-gradient(1.4px 1.4px at 46% 12%, #cfe8ff 50%, transparent 51%), radial-gradient(1px 1px at 63% 64%, #fff 50%, transparent 51%),
          radial-gradient(1.3px 1.3px at 78% 22%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 88% 78%, #cfe8ff 50%, transparent 51%),
          radial-gradient(1px 1px at 8% 86%, #fff 50%, transparent 51%), radial-gradient(1.2px 1.2px at 36% 40%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 70% 42%, #fff 50%, transparent 51%), radial-gradient(1.5px 1.5px at 92% 50%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 54% 88%, #cfe8ff 50%, transparent 51%), radial-gradient(1.1px 1.1px at 20% 54%, #fff 50%, transparent 51%);
      }
      /* aurora */
      .boot-aurora { position: absolute; left: -20%; right: -20%; height: 46%; top: 6%; filter: blur(42px); opacity: .55; pointer-events: none; }
      .boot-aurora i { position: absolute; inset: 0; border-radius: 50%; animation: bootAurora 7s ease-in-out infinite alternate; }
      .boot-aurora i:nth-child(1) { background: linear-gradient(100deg, transparent 10%, #3dffb0 35%, #4cd6fb 55%, transparent 80%); transform: skewY(-6deg); }
      .boot-aurora i:nth-child(2) { background: linear-gradient(80deg, transparent 20%, #9b6bff 45%, #4cd6fb 60%, transparent 85%); top: 22%; opacity: .7; animation-duration: 9s; animation-direction: alternate-reverse; }
      .boot-stack { position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; padding: 24px; }
      .boot-mark { position: relative; width: 148px; height: 148px; display: grid; place-items: center; }
      .boot-mark svg { position: absolute; inset: 0; transform: rotate(-90deg); }
      .boot-ring { fill: none; stroke: #4cd6fb; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 440; stroke-dashoffset: 440; animation: bootRing 1.2s .1s cubic-bezier(.65,0,.35,1) forwards; filter: drop-shadow(0 0 6px #4cd6fb); }
      .boot-ring2 { fill: none; stroke: rgba(207,232,255,.18); stroke-width: 1; }
      .boot-mark img { width: 108px; height: 108px; animation: bootEmblem 1.15s cubic-bezier(.2,.8,.2,1) both, bootGlow 2.4s 1.2s ease-in-out infinite; }
      .boot-name { display: flex; gap: .14em; font-size: clamp(34px, 6vw, 52px); font-weight: 700; letter-spacing: .02em; }
      .boot-name span { display: inline-block; animation: bootLetter .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(.55s + var(--i) * .07s); }
      .boot-tag { font-family: Inter, 'Segoe UI', system-ui, sans-serif; font-size: 14px; color: #cfe8ff; opacity: 0; animation: bootFade .7s 1.1s ease forwards; }
      .boot-credit { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; letter-spacing: .12em; color: #8fb3d9; opacity: 0; animation: bootFade .7s 1.3s ease forwards; }
      .boot-bar { width: 168px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; opacity: 0; animation: bootFade .5s .9s ease forwards; }
      .boot-bar i { display: block; height: 100%; width: 40%; border-radius: 3px; background: linear-gradient(90deg, #3dffb0, #4cd6fb, #9b6bff); animation: bootBar 1.3s ease-in-out infinite; }
      @keyframes bootRing { to { stroke-dashoffset: 0; } }
      @keyframes bootEmblem { from { opacity: 0; transform: scale(.35) rotate(-140deg); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
      @keyframes bootGlow { 0%, 100% { filter: drop-shadow(0 0 4px rgba(76,214,251,.35)); } 50% { filter: drop-shadow(0 0 18px rgba(76,214,251,.85)); } }
      @keyframes bootLetter { from { opacity: 0; transform: translateY(14px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
      @keyframes bootFade { to { opacity: 1; } }
      @keyframes bootBar { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
      @keyframes bootAurora { from { transform: translateX(-6%) skewY(-6deg); } to { transform: translateX(6%) skewY(-2deg); } }
      @keyframes bootTwinkle { from { opacity: .45; } to { opacity: .95; } }
      @media (prefers-reduced-motion: reduce) {
        #boot *, #boot::before { animation: none !important; }
        .boot-ring { stroke-dashoffset: 0; }
        .boot-tag, .boot-credit, .boot-bar { opacity: 1; }
      }
    </style>
  </head>
  <body class="bg-[#f8f9ff] text-[#0b1c30] antialiased selection:bg-[#00b4d8]/20 selection:text-[#00677d]">
    <div id="boot" role="status" aria-label="Loading HIMAKSHA" title="Tap to skip">
      <div class="boot-aurora" aria-hidden="true"><i></i><i></i></div>
      <div class="boot-stack">
        <div class="boot-mark" aria-hidden="true">
          <svg viewBox="0 0 148 148"><circle class="boot-ring2" cx="74" cy="74" r="70" /><circle class="boot-ring" cx="74" cy="74" r="70" /></svg>
          <img src="/polaris-emblem.svg" alt="" />
        </div>
        <div class="boot-name" aria-hidden="true"><span style="--i:0">H</span><span style="--i:1">I</span><span style="--i:2">M</span><span style="--i:3">A</span><span style="--i:4">K</span><span style="--i:5">S</span><span style="--i:6">H</span><span style="--i:7">A</span></div>
        <div class="boot-tag">हिमाक्ष · India's polar knowledge axis</div>
        <div class="boot-bar" aria-hidden="true"><i></i></div>
        <div class="boot-credit">SIH 2026 · PS 26063 · CODENAME POLARIS</div>
      </div>
    </div>
    <script>
      (function () {
        var el = document.getElementById('boot');
        if (!el) return;
        if (document.documentElement.classList.contains('boot-skip')) { el.remove(); return; }
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        var start = performance.now(), min = reduce ? 400 : 1700, max = 6000, finished = false, timer = 0;
        function finish() {
          if (finished) return;
          finished = true;
          try { sessionStorage.setItem('polaris-booted', '1'); } catch (e) {}
          // Morph: the splash emblem flies into the header logo (View Transitions API), the splash dissolves.
          var logo = document.querySelector('[data-boot-logo]');
          var img = el.querySelector('.boot-mark img');
          if (document.startViewTransition && logo && img && !reduce) {
            img.style.animation = 'none'; // hold the emblem steady for the snapshot
            img.style.viewTransitionName = 'polaris-emblem';
            document.documentElement.classList.add('vt-boot');
            var t = document.startViewTransition(function () {
              el.remove();
              logo.style.viewTransitionName = 'polaris-emblem';
            });
            t.finished.finally(function () {
              logo.style.viewTransitionName = '';
              document.documentElement.classList.remove('vt-boot');
            });
            return;
          }
          el.classList.add('done');
          setTimeout(function () { el.remove(); }, 800);
        }
        // Data ready (or the time-out): finish once the intro has played for at least `min` ms.
        function ready() {
          if (finished || timer) return;
          timer = setTimeout(finish, Math.max(0, min - (performance.now() - start)));
        }
        window.addEventListener('polaris:ready', ready);
        setTimeout(ready, max);
        el.addEventListener('click', finish); // tap to skip
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
